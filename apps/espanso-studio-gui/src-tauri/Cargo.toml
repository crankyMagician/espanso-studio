[package]
name = "espanso-studio-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "espanso_studio_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2.10.2", features = [] }
thiserror = "2.0"
